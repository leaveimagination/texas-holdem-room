name: texas-holdem

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: holdem
      POSTGRES_USER: holdem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdem -d holdem"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    image: texas-holdem-friends-room:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://holdem:${POSTGRES_PASSWORD}@postgres:5432/holdem?schema=public
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:?APP_PORT is required}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
